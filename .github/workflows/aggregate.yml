name: Aggregate

on:
    schedule:
        - cron: "0 * * * *"
    workflow_dispatch: # Allow manual trigger

# Pushes go through BOT_PAT, so the default token only needs to read
permissions:
    contents: read

# Never let two runs push to the data branch at the same time
concurrency:
    group: aggregate
    cancel-in-progress: false

env:
    DATA_BRANCH: data
    # Use exactly the toolchain pinned in go.mod, and build a static binary
    GOTOOLCHAIN: local
    CGO_ENABLED: "0"

jobs:
    aggregate:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            # Source code lives on main, which scheduled runs are triggered from.
            # BOT_PAT lets the stats step push back to main, so its credentials
            # are kept (persist-credentials defaults to true)
            - name: Checkout source code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  token: ${{ secrets.BOT_PAT }}

            # Check out straight into the aggregator's output directory so it
            # merges new results into the existing files. Its credentials are
            # kept too, for pushing the data branch
            - name: Checkout data branch into out/
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.DATA_BRANCH }}
                  path: out
                  fetch-depth: 1
                  token: ${{ secrets.BOT_PAT }}

            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true

            # Build once with the same flags as CI, then run the binary
            - name: Build
              run: make build

            # Exits 1 if any source fails; the steps below still publish what
            # the other sources stored, and the run is marked as failed
            - name: Run Aggregate
              run: ./bin/aggregator -out out -log json
              env:
                  ABUSECH_API_KEY: ${{ secrets.ABUSECH_API_KEY }}

            - name: Commit and push data branch
              id: data
              if: ${{ !cancelled() }}
              working-directory: out
              run: |
                  git config user.name "HoardCTI [bot]"
                  git config user.email "admin@hoardcti.com"

                  # Add all files (new, modified, deleted)
                  git add -A

                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                    git commit -m "Update C2 - $(date -u +'%Y-%m-%d %H:%M:%S')"
                    git push origin "HEAD:$DATA_BRANCH"
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            # Only when the data changed, so last_edit is the last data update
            # and main doesn't get an empty commit every hour. Skipped on manual
            # runs from other branches so they never push to main.
            - name: Update stats.json and push to main
              if: ${{ !cancelled() && steps.data.outputs.changed == 'true' && github.ref == 'refs/heads/main' }}
              run: |
                  # Every IP is stored as exactly one .json file
                  SERVERS=0
                  for dir in out/ipv4 out/ipv6; do
                    if [ -d "$dir" ]; then
                      SERVERS=$((SERVERS + $(find "$dir" -type f -name '*.json' | wc -l)))
                    fi
                  done

                  # Thousands separators, e.g. 3204 -> 3,204
                  SERVERS=$(echo "$SERVERS" | sed -E ':a; s/([0-9])([0-9]{3})($|,)/\1,\2\3/; ta')

                  LAST_EDIT=$(date -u +'%d %b %Y, %H:%M UTC')

                  printf '{\n    "servers": "%s",\n    "last_edit": "%s"\n}\n' "$SERVERS" "$LAST_EDIT" > stats.json
                  cat stats.json

                  git config user.name "HoardCTI [bot]"
                  git config user.email "admin@hoardcti.com"

                  git add stats.json
                  git commit -m "Update stats - $SERVERS servers"

                  # Pick up anything pushed to main while this run was going
                  git pull --rebase origin main
                  git push origin HEAD:main
