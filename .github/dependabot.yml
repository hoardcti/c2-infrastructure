version: 2
updates:
    # Go modules and the tool directives in go.mod (GO-MOD-009)
    - package-ecosystem: "gomod"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "05:00"
      open-pull-requests-limit: 10
      labels:
          - "dependencies"
          - "go"
      commit-message:
          prefix: "build"
      groups:
          go-minor-patch:
              update-types:
                  - "minor"
                  - "patch"

    # The SHA-pinned actions in .github/workflows (GO-CI-003)
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      labels:
          - "dependencies"
      commit-message:
          prefix: "ci"
      groups:
          actions:
              patterns:
                  - "*"
